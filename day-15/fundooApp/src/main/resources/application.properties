spring.application.name=fundooApp
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fundoo_notes_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

fundoo.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
fundoo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
fundoo.messaging.jms.enabled=${JMS_ENABLED:false}
fundoo.messaging.rabbit.enabled=${RABBIT_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
