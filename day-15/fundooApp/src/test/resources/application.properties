spring.datasource.url=jdbc:h2:mem:fundoo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
fundoo.jwt.secret=test-secret-that-is-at-least-32-characters-long
fundoo.jwt.expiration-ms=86400000
fundoo.messaging.jms.enabled=false
fundoo.messaging.rabbit.enabled=false
